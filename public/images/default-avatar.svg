  </defs>
  <rect width="128" height="128" rx="64" fill="url(#bg)"/>
  <!-- Cute minimalist puppy ears -->
  <ellipse cx="38" cy="54" rx="13" ry="22" transform="rotate(18 38 54)" fill="#C98A3F"/>
  <ellipse cx="90" cy="54" rx="13" ry="22" transform="rotate(-18 90 54)" fill="#C98A3F"/>
