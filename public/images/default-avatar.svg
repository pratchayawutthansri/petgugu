  <!-- Muzzle -->
  <ellipse cx="64" cy="73" rx="13" ry="10" fill="#FFF8EE"/>
  <!-- Nose -->
  <ellipse cx="64" cy="69.5" rx="5.5" ry="3.8" fill="#193D4F"/>
  <!-- Smile -->
